  - "哪个好"
  - "怎么配置"
  - "如何配置"
  - "策略"
  - "机会"
  - "风险"

# 无条件拦截短语 —— 语义足够明确，无需第二动作词
always_block_keywords:
  - keyword: "该买什么股票"
    severity: "high"
  - keyword: "买哪只股票"
    severity: "high"
  - keyword: "推荐几只股票"
    severity: "high"
  - keyword: "股票推荐"
    severity: "high"
  - keyword: "荐股"
    severity: "high"
  - keyword: "投资建议"
    severity: "high"
  - keyword: "理财建议"
    severity: "high"
  - keyword: "财务建议"
    severity: "high"
  - keyword: "怎么投资"
    severity: "high"
  - keyword: "如何投资"
    severity: "high"
  - keyword: "怎么炒股"
    severity: "high"
  - keyword: "炒股技巧"
    severity: "high"
  - keyword: "基金推荐"
    severity: "high"
  - keyword: "该买什么基金"
    severity: "high"
  - keyword: "比特币值得投资吗"
    severity: "high"
  - keyword: "黄金值得投资吗"
    severity: "high"
  - keyword: "市场预测"
    severity: "high"
  - keyword: "大盘走势预测"
    severity: "high"
  - keyword: "股市预测"
    severity: "high"
  - keyword: "明年股市"
    severity: "high"
  - keyword: "退休理财规划"
    severity: "high"
  - keyword: "养老理财"
    severity: "high"
  - keyword: "财富增值"
    severity: "high"
  - keyword: "稳赚不赔"
    severity: "high"
  - keyword: "保本高收益"
    severity: "high"

# 短语模式 —— 捕获不出现显式财务术语的变体请求（中文换说法）
phrase_patterns:
  - '(?:把|将|拿|放)(?:我|自己)?(?:的)?(?:钱|资金|积蓄|存款).{0,12}(?:投|放|存)(?:到|进|在)'
  - '(?:钱|资金|积蓄|存款).{0,10}(?:怎么|如何|怎样)(?:增值|保值|翻倍|生钱)'
  - '(?:有什么|有没有).{0,8}(?:稳赚|赚钱|收益高).{0,6}(?:项目|渠道|路子|门路)'
  - '(?:闲钱|余钱|手上的钱).{0,15}(?:怎么办|放哪|存哪|买什么)'
  - '(?:哪只|哪个|什么)(?:股票|基金|币|币种).{0,10}(?:好|值得|靠谱|能买|会涨)'

# 关键词 —— 留空：使用条件匹配（主题词+动作词同句）而非单词拦截，避免"基金 app"之类误伤
keywords: []

# 例外词 —— 覆盖同句条件匹配，防止财务词在非财务语境的误伤
exceptions:
  # 基金会/公益组织（"基金"在公益语境）
  - "基金会"
  - "公益基金"
  - "慈善基金"
  - "希望工程"
  # 证券在法律语境
  - "证券法"
  - "证券诈骗"
  # 黄金非投资语境
  - "黄金周"
  - "金牌"
  - "黄金时段"
  - "黄金会员"
  # 期货非金融语境
  - "期货交易员招聘"
  # 投资在非金融语境
  - "投资自己"
  - "投资时间"
  - "投资学习"
  - "人力资本投资"
  - "教育投资"
  # 保险非理财语境
  - "医保"
  - "社保"
  - "交强险"
  # 常见系统问题
  - "怎么下载"
  - "怎么开户注销"
  - "客服电话"
