  - "买入"
  - "购买"
  - "卖"
  - "卖出"
  - "抛"
  - "抄底"
  - "加仓"
  - "减仓"
  - "止损"
  - "止盈"
  - "推荐"
  - "推介"
  - "建议"
  - "咨询"
  - "值得"
  - "能不能买"
  - "该不该"
  - "要不要"
  - "怎么买"
  - "如何买"
  - "怎么定投"
  - "如何定投"
  - "什么时候买"
  - "什么时候卖"
  - "会涨"
  - "会跌"
  - "涨到"
  - "跌到"
  - "翻倍"
  - "行情"
  - "走势"
  - "预测"
  - "分析一下"
  - "帮我看看"
  - "值不值"
  - "划算"
  - "靠谱"
  - "稳赚"
  - "赚钱"
