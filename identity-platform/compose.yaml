name: ai-identity-platform
services:
  database:
    image: 192.168.22.6:5000/ai-gw/identity-db:16
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD}
    volumes:
      - identity-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U identity -d identity']
      interval: 5s
      timeout: 3s
      retries: 30
  identity:
    image: 192.168.22.6:5000/ai-gw/identity:1
    command: [start-dev, --import-realm]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://database:5432/identity
      KC_DB_USERNAME: identity
      KC_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${IDENTITY_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${IDENTITY_ADMIN_PASSWORD:?Set IDENTITY_ADMIN_PASSWORD}
      KC_HOSTNAME: ${IDENTITY_PUBLIC_URL:-http://127.0.0.1:18080}
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:18080:8080'
    volumes:
      - ./realm.json:/opt/keycloak/data/import/company-realm.json:ro
      - ./keycloak-theme:/opt/keycloak/themes:ro
    depends_on:
      database:
        condition: service_healthy
volumes:
  identity-db:
