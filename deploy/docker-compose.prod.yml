name: ai-tokengw
# 拆分镜像运行时编排：core=python 镜像（完整 proxy），ui=nginx 静态站点并反代 API，
# db/monitor 两个镜像保持不变。rust 镜像为构建期 wheel 产物，不参与运行时编排。
services:
  core:
    image: ${PYTHON_IMAGE:-192.168.22.6:5000/ai-gw/python:1}
    container_name: ai-tokengw-core
    environment:
      DATABASE_URL: postgresql://llmproxy:${DB_PASSWORD:-dbpassword9090}@db:5432/litellm
      STORE_MODEL_IN_DB: 'True'
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-ai-gw-default}
      LITELLM_UI_IDENTITY_ADMIN_URL: ${LITELLM_UI_IDENTITY_ADMIN_URL:-}
      LITELLM_UI_PROMETHEUS_URL: ${LITELLM_UI_PROMETHEUS_URL:-}
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${UI_PASSWORD:-AI-GovernanceGw@2026}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      # 定价数据来源：本地挂载 JSON（不访问外网），外部修改后经
      # POST /reload/model_cost_map 热重载
      LITELLM_MODEL_COST_MAP_PATH: ${LITELLM_MODEL_COST_MAP_PATH:-/app/model_prices_and_context_window.json}
      # 策略模板来源：本地挂载 JSON（不访问外网），替代 GitHub 拉取
      LITELLM_POLICY_TEMPLATES_PATH: ${LITELLM_POLICY_TEMPLATES_PATH:-/app/policy_templates.json}
      # 护栏拦截提示语语言：en（默认，保持原英文消息）/ zh（面向终端用户中文）
      LITELLM_GUARDRAIL_VIOLATION_MESSAGE_LOCALE: ${LITELLM_GUARDRAIL_VIOLATION_MESSAGE_LOCALE:-en}
    volumes:
    - ./proxy_config.yaml:/app/proxy_config.yaml:ro
    - ./model_prices_and_context_window.json:/app/model_prices_and_context_window.json
    - ./policy_templates.json:/app/policy_templates.json
    command:
    - --config
    - /app/proxy_config.yaml
    - --port
    - '4000'
    depends_on:
      db:
        condition: service_healthy
    restart: always
    healthcheck:
      test:
      - CMD-SHELL
      - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    expose:
    - '4000'
  db:
    image: 192.168.22.6:5000/ai-gw/postgres:16
    container_name: ai-tokengw-db
    restart: always
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dbpassword9090}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -d litellm -U llmproxy
      interval: 1s
      timeout: 5s
      retries: 10
  monitor:
    image: 192.168.22.6:5000/ai-gw/prometheus:1
    container_name: ai-tokengw-monitor
    ports:
    - ${MONITOR_PORT:-9090}:9090
    volumes:
    - prometheus_data:/prometheus
    - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./metrics-token:/etc/prometheus/metrics-token:ro
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=15d
    restart: always
  ui:
    image: ${UI_IMAGE:-192.168.22.6:5000/ai-gw/ui:1}
    ports:
    - ${CORE_PORT:-4000}:3000
    volumes:
    - ./nginx.split.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:3000/healthz
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
    name: ai_tokengw_postgres_data
  prometheus_data:
    name: ai_tokengw_prometheus_data
