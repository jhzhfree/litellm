# 中文版：财务/投资建议拦截（denied_financial_advice 的中文配套分类）
#
# 匹配逻辑与英文版一致（条件匹配）：同一句话中同时出现「财务主题词(identifier_words)」
# 和「动作/咨询词(additional_block_words)」时拦截；always_block_keywords 无条件拦截；
# phrase_patterns 兜底捕获换一种说法的荐股/投资咨询；exceptions 防误伤。
#
# 依赖 content_filter.py 的分句支持中文句读（。！？；），中文整段文本才能按句精确匹配。
#
# 测试建议：为该分类建立中文评测集后运行
#   pytest litellm/proxy/guardrails/guardrail_hooks/litellm_content_filter/guardrail_benchmarks/test_eval.py
category_name: "denied_financial_advice_zh"
display_name: "拒绝财务/投资建议（中文）"
display_name_zh: "拒绝财务/投资建议"
description: "检测中文语境下的个性化财务建议、投资推荐与理财规划请求，此类请求应由持牌理财顾问提供"
default_action: "BLOCK"

# 主题词 —— 标记话题是财务/投资的名词（与动作词同句出现才拦）
identifier_words:
