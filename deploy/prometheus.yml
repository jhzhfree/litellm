# 监控抓取配置（挂载到 ai-tokengw-monitor:/etc/prometheus/prometheus.yml）
# 修改后执行: docker restart ai-tokengw-monitor
# 如需重新抓取而不重启，可发送 SIGHUP: docker kill -s HUP ai-tokengw-monitor

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "ai-tokengw-core"
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token # deploy/prepare.sh 从 .env 生成
    static_configs:
      - targets: ["core:4000"] # compose 网络内的核心应用服务名
