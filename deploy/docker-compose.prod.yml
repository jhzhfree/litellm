name: ai-tokengw
services:
  core:
    image: ${PYTHON_IMAGE:?Set PYTHON_IMAGE to the split Python image}
    container_name: ai-tokengw-core
    environment:
      DATABASE_URL: postgresql://llmproxy:${DB_PASSWORD:-dbpassword9090}@db:5432/litellm
      STORE_MODEL_IN_DB: 'True'
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-ai-gw-default}
      UI_USERNAME: ${UI_USERNAME:-admin}
      UI_PASSWORD: ${UI_PASSWORD:-AI-GovernanceGw@2026}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    volumes:
    - ./proxy_config.yaml:/app/proxy_config.yaml:ro
    command:
    - --config
    - /app/proxy_config.yaml
    - --port
    - '4000'
    depends_on:
      db:
        condition: service_healthy
    restart: always
    healthcheck:
      test:
      - CMD-SHELL
      - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    expose:
    - '4000'
    entrypoint:
    - /app/.venv/bin/litellm
  db:
    image: 192.168.22.6:5000/ai-gw/postgres:16
    container_name: ai-tokengw-db
    restart: always
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dbpassword9090}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -d litellm -U llmproxy
      interval: 1s
      timeout: 5s
      retries: 10
  monitor:
    image: 192.168.22.6:5000/ai-gw/prometheus:1
    container_name: ai-tokengw-monitor
    ports:
    - ${MONITOR_PORT:-9090}:9090
    volumes:
    - prometheus_data:/prometheus
    - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./metrics-token:/etc/prometheus/metrics-token:ro
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --storage.tsdb.retention.time=15d
    restart: always
  ui:
    image: ${UI_IMAGE:?Set UI_IMAGE to the split frontend image}
    ports:
    - ${CORE_PORT:-4000}:3000
    volumes:
    - ./nginx.split.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - wget
      - -q
      - --spider
      - http://127.0.0.1:3000/healthz
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
    name: ai_tokengw_postgres_data
  prometheus_data:
    name: ai_tokengw_prometheus_data
