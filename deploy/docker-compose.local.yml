# 本地测试用覆盖文件：单体 gateway:1 镜像自带 UI，
# core 直接把 4000 映射到宿主机（拆分部署时由 ui 服务映射，无需此文件）。
# 用法见 LOCAL_DEV.md「启动产品栈」。
services:
  core:
    ports:
      - "${CORE_PORT:-4000}:4000"
    # 临时：把源码中新增的定价重载模块挂进容器，下次 build-push.sh 重建镜像后可删除这两行
    volumes:
      - ../litellm/litellm_core_utils/get_model_cost_map.py:/app/.venv/lib/python3.13/site-packages/litellm/litellm_core_utils/get_model_cost_map.py
