  - "白银"
  - "贵金属"
  # 数字货币
  - "比特币"
  - "以太坊"
  - "虚拟货币"
  - "加密货币"
  - "数字货币"
  - "区块链投资"
  - "币圈"
  # 投资行为泛称
  - "投资"
  - "投资者"
  - "炒股"
  - "持仓"
  - "建仓"
  - "补仓"
  - "清仓"
  - "仓位"
  - "盘面"
  - "k线"
  - "大盘"
  - "牛市"
  - "熊市"
  # 财务规划
  - "资产配置"
  - "财富管理"
  - "理财顾问"
  - "理财规划"
  - "养老理财"
  - "年金险"
  - "分红险"
  - "退休理财"
  - "复利"
  - "年化收益"
  - "收益率"
  - "股息"
  - "分红"
  - "ipo"
  - "打新股"
  - "市值"

# 动作词 —— 咨询/操作类词，同一句出现主题词+动作词即拦截
additional_block_words:
